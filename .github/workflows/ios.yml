name: iOS checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Check the Liquid Glass SDK
        run: |
          xcodebuild -version
          major=$(xcodebuild -version | awk '/^Xcode / {split($2, version, "."); print version[1]}')
          test "$major" -ge 26
      - name: Run app unit and UI tests
        run: ./scripts/test-ios.sh
